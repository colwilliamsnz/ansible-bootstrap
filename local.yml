---

- name: Basic System Setup for later Ansible Playbooks
  hosts: localhost
  connection: local
  become: true
  vars_files:
    - vars/main.yml

  tasks:

   - name: Install packages and keep them updated
     ansible.builtin.package:
       name: "{{ packages }}"
       state: latest

   - name: Set the system timezone
     ansible.builtin.file:
       src: "/usr/share/zoneinfo/{{ system_timezone }}"
       dest: /etc/localtime
       state: link
       force: true

   - name: Create the ansible service account user
     ansible.builtin.user:
       name: "{{ admin_user }}"
       groups: "{{ admin_group }}"
       append: true
       shell: /bin/bash
       create_home: true

   - name: Allow the admin group access to sudo without a password
     ansible.builtin.copy:
       content: "%{{ admin_group }} ALL=(ALL) NOPASSWD: ALL\n"
       dest: /etc/sudoers.d/99-ansible
       owner: root
       group: root
       mode: "0440"
       validate: "visudo -cf %s"

   - name: Make sure a service is enabled and running
     ansible.builtin.service:
       name: "{{ managed_service }}"
       state: started
       enabled: true
