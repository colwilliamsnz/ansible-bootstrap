---

- name: Wattle Labs Ansible-Pull Bootstrap
  hosts: localhost
  connection: local
  become: true
  vars_files:
    - vars/main.yml

  pre_tasks:

    - name: Fail fast on unsupported OS
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: "This bootstrap supports Debian/Ubuntu only (found {{ ansible_facts['os_family'] }})."

    - name: Fail fast if the controller public key is missing or malformed
      ansible.builtin.assert:
        that:
          - controller_pubkey is match('^(ssh-|ecdsa-|sk-)')
          - controller_pubkey.split() | length >= 2
          - "'...' not in controller_pubkey"
        fail_msg: "controller_pubkey in vars/main.yml is unset or still the placeholder."

    - name: Fail fast if no SSH source networks are defined (would lock out SSH)
      ansible.builtin.assert:
        that:
          - ssh_allowed_cidrs | length > 0
        fail_msg: "ssh_allowed_cidrs in vars/main.yml must contain at least one network."

  handlers:

    - name: Reload ufw
      ansible.builtin.command: ufw reload
      changed_when: true

  tasks:

    # ---------- Packages ----------

    - name: Install bootstrap prerequisites
      ansible.builtin.apt:
        name:
          - tzdata
          - locales
          - ufw
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present

    # ---------- Timezone ----------

    - name: Check the timezone exists in zoneinfo
      ansible.builtin.stat:
        path: "/usr/share/zoneinfo/{{ system_timezone }}"
      register: tz_zoneinfo

    - name: Fail if the timezone name is invalid
      ansible.builtin.assert:
        that:
          - tz_zoneinfo.stat.exists
        fail_msg: "system_timezone '{{ system_timezone }}' not found in /usr/share/zoneinfo."

    - name: Point /etc/localtime at the timezone
      ansible.builtin.file:
        src: "/usr/share/zoneinfo/{{ system_timezone }}"
        dest: /etc/localtime
        state: link
        force: true

    - name: Keep /etc/timezone in sync
      ansible.builtin.copy:
        content: "{{ system_timezone }}\n"
        dest: /etc/timezone
        owner: root
        group: root
        mode: "0644"

    # ---------- Locale ----------

    - name: Enable the locale in /etc/locale.gen
      ansible.builtin.lineinfile:
        path: /etc/locale.gen
        regexp: "^#?\\s*{{ system_locale | regex_escape }}\\s"
        line: "{{ system_locale }} {{ system_locale.split('.')[1] }}"
        create: true
        owner: root
        group: root
        mode: "0644"

    - name: List generated locales
      ansible.builtin.command: locale -a
      register: locales_generated
      changed_when: false
      check_mode: false

    - name: Generate the locale
      ansible.builtin.command: locale-gen
      changed_when: true
      when: >-
        (system_locale | lower | replace('-', ''))
        not in (locales_generated.stdout_lines | map('lower') | list)

    - name: Set the system default locale
      ansible.builtin.lineinfile:
        path: /etc/default/locale
        regexp: "^LANG="
        line: "LANG={{ system_locale }}"
        create: true
        owner: root
        group: root
        mode: "0644"

    # ---------- Service account ----------

    - name: Create the Ansible service account (locked password, key-only)
      ansible.builtin.user:
        name: "{{ ansible_svc_user }}"
        home: "{{ ansible_svc_home }}"
        shell: "{{ ansible_svc_shell }}"
        create_home: true
        password: "!"
        update_password: on_create

    - name: Ensure the service account .ssh directory exists
      ansible.builtin.file:
        path: "{{ ansible_svc_home }}/.ssh"
        state: directory
        owner: "{{ ansible_svc_user }}"
        group: "{{ ansible_svc_user }}"
        mode: "0700"

    - name: Build the authorized_keys options string
      ansible.builtin.set_fact:
        controller_key_opts: >-
          {{ ([controller_key_options]
              + (['from="' ~ controller_from ~ '"'] if controller_from | length > 0 else []))
             | select | join(',') }}

    # The file is authoritative: only the controller key is present. Any other
    # key for this account is removed.
    - name: Install the controller public key (authoritative)
      ansible.builtin.copy:
        content: "{{ (controller_key_opts ~ ' ') if controller_key_opts | length > 0 else '' }}{{ controller_pubkey }}\n"
        dest: "{{ ansible_svc_home }}/.ssh/authorized_keys"
        owner: "{{ ansible_svc_user }}"
        group: "{{ ansible_svc_user }}"
        mode: "0600"

    - name: Allow the service account passwordless sudo
      ansible.builtin.copy:
        content: "{{ ansible_svc_user }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: "{{ sudoers_dropin_path }}"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      when: grant_sudo | bool

    - name: Remove the sudoers drop-in when sudo is not granted
      ansible.builtin.file:
        path: "{{ sudoers_dropin_path }}"
        state: absent
      when: not (grant_sudo | bool)

    # ---------- Firewall (UFW) ----------
    # Order matters: SSH rules are reconciled before UFW is enabled, so SSH from
    # ssh_allowed_cidrs is never cut off. Managed rules take the form
    # "allow from <cidr> to any port <ssh_port> proto tcp".

    - name: Read current UFW rules
      ansible.builtin.command: ufw show added
      register: ufw_added
      changed_when: false
      check_mode: false

    - name: Read UFW status
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      check_mode: false

    - name: Work out desired and existing managed SSH rules
      ansible.builtin.set_fact:
        ufw_ssh_desired: >-
          {{ ssh_allowed_cidrs
             | map('regex_replace', '^', 'ufw allow from ')
             | map('regex_replace', '$', ' to any port ' ~ ssh_port ~ ' proto tcp')
             | list }}
        ufw_ssh_managed: >-
          {{ ufw_added.stdout_lines
             | map('regex_replace', '\s+comment\s.*$', '')
             | select('match', '^ufw allow from \S+ to any port ' ~ ssh_port ~ ' proto tcp$')
             | list }}

    - name: Remove SSH rules for networks no longer in ssh_allowed_cidrs
      ansible.builtin.command: "ufw delete {{ item | regex_replace('^ufw ', '') }}"
      loop: "{{ ufw_ssh_managed | difference(ufw_ssh_desired) }}"
      changed_when: true

    # Any other allow or limit rule that mentions ssh_port (e.g. "allow 22/tcp",
    # "limit 22/tcp", "allow OpenSSH", "allow from any to any port 22",
    # "allow in on eth0 to any port 22") is deleted.
    - name: Remove other SSH allow/limit rules
      ansible.builtin.command: "ufw delete {{ item }}"
      loop: >-
        {{ ufw_added.stdout_lines
           | select('match', '^ufw (allow|limit)(\s|$)')
           | reject('match', '^ufw allow from \S+ to any port ' ~ ssh_port ~ ' proto tcp(\s|$)')
           | select('search', '(^|\s)(' ~ ssh_port ~ '(/tcp)?|OpenSSH|ssh)(\s|$)')
           | map('regex_replace', '^ufw ', '')
           | map('regex_replace', '\s+comment\s.*$', '')
           | unique }}
      changed_when: true

    - name: Allow SSH from each permitted network
      ansible.builtin.command: "{{ item }} comment 'bootstrap-ssh'"
      loop: "{{ ufw_ssh_desired | difference(ufw_ssh_managed) }}"
      changed_when: true

    - name: Default deny inbound
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: "^DEFAULT_INPUT_POLICY="
        line: 'DEFAULT_INPUT_POLICY="DROP"'
      notify: Reload ufw

    - name: Default allow outbound
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: "^DEFAULT_OUTPUT_POLICY="
        line: 'DEFAULT_OUTPUT_POLICY="ACCEPT"'
      notify: Reload ufw

    - name: Enable UFW
      ansible.builtin.command: ufw --force enable
      when: "'Status: inactive' in ufw_status.stdout"
      changed_when: true

    # ---------- Services ----------

    - name: Ensure the SSH service is enabled and running
      ansible.builtin.service:
        name: "{{ ssh_service_name }}"
        state: started
        enabled: true
