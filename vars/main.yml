---

# Time and locale
system_timezone: Pacific/Auckland
system_locale: en_NZ.UTF-8

# Service account the Ansible controller connects as
ansible_svc_user: svc_ansible
ansible_svc_home: "/home/{{ ansible_svc_user }}"
ansible_svc_shell: /bin/bash

# Controller public key (not a secret, but repo integrity matters: see README)
controller_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAXfg6TuKUUg2xoXWjl3bAeleXKLffnUs9pYX9buq6FQ Wattle-Ansible"

# Optional: restrict the key to the controller's source IP(s), comma separated.
# Must fall inside ssh_allowed_cidrs. Leave empty for no restriction.
controller_from: "10.10.2.31"

# authorized_keys options prepended to the controller key, comma separated.
# "restrict" disables port/agent/X11 forwarding and pty allocation. Ansible
# does not need any of these. Leave empty for no options.
controller_key_options: "restrict"

# Passwordless sudo for the service account only
grant_sudo: true
sudoers_dropin_path: /etc/sudoers.d/99-ansible

# Service that must be enabled and running ("ssh" on Debian/Ubuntu)
ssh_service_name: ssh

# Base packages installed on every run (present, not upgraded; patching is the controller's job)
base_packages:
  - openssh-server
  - iputils-ping
  - nano
  - curl
  - tmux
  - wget

# UFW: SSH is only reachable from these networks. All other inbound traffic is denied.
# Any other UFW allow/limit rule for ssh_port is removed, so this list is authoritative.
ssh_port: 22
ssh_allowed_cidrs:
  - 10.10.2.0/24---

